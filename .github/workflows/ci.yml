name: CI frontend

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, tests et build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérifier les types (vue-tsc, contrat OpenAPI inclus)
        run: npm run type-check

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Tests unitaires
        run: npx vitest run

      - name: Build de production
        run: npm run build-only
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1

      - name: Lint (eslint)
        run: npx eslint .

  e2e:
    name: Tests navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npx playwright test
